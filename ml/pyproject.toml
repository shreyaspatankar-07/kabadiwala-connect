[project]
name = "kabadiwala-ml"
version = "0.1.0"
description = "Machine learning and pricing benchmarking models for Kabadiwala Connect"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scikit-learn>=1.4.1.post1",
    "lightgbm>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM"]
ignore = ["B008", "E501", "BLE001", "RUF059", "PT018", "E402", "F841", "S110", "A001", "A002", "A003", "N806", "C414", "C401", "B904", "SIM108", "SIM103", "UP015", "PT011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
