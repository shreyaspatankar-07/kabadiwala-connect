version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kabadiwala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kabadiwala_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kabadiwala_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kabadiwala} -d ${POSTGRES_DB:-kabadiwala_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kabadiwala:kabadiwala_secure_pass@postgres:5432/kabadiwala_db}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_e9f2a8c14b}
      ENVIRONMENT: development
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    networks:
      - kc_network

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: kc_portal
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000/api/v1}
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    volumes:
      - ./portal:/app
      - /app/node_modules
      - /app/.next
    networks:
      - kc_network

volumes:
  postgres_data:
    driver: local

networks:
  kc_network:
    driver: bridge
